name: drowsiness_app
description: Driver Safety Monitor - client temps réel (WebSocket) pour téléphone.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  url_launcher: ^6.3.0
  vibration: ^3.2.1
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/beep.wav
    - assets/siren.wav
